name: Qualité
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5 (révision vérifiée)
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]"
      - run: python scripts/check_repository.py
      - run: python -m ruff check .
      - run: python -m pytest
  distribution:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5 (révision vérifiée)
        with:
          python-version: '3.13'
      - run: python -m pip install -e ".[dev]"
      - run: python -m build
      - run: python scripts/check_distribution.py
      - run: python -m venv .wheel-check
      - run: .wheel-check/bin/python -m pip install dist/*.whl
      - name: Vérifier les catalogues installés hors des sources
        working-directory: /tmp
        run: |
          "$GITHUB_WORKSPACE/.wheel-check/bin/python" -c "from gnu_astrolist.catalog import load_caldwell_catalog, load_messier_catalog; assert len(load_caldwell_catalog()) == 109; assert len(load_messier_catalog()) == 110"
          "$GITHUB_WORKSPACE/.wheel-check/bin/python" -m gnu_astrolist --date 2026-08-15 --time-range 21:00-22:00 --lat 45 --lon 0 --az-min 0 --az-max 360 --min-altitude 20 --objects caldwell --max-magnitude -20 --offline

