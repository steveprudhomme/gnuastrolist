name: Qualité
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Installer le verrou avec empreintes
        shell: bash
        run: |
          version="${{ matrix.python }}"
          platform=linux
          if [[ "${{ runner.os }}" == "Windows" ]]; then platform=windows; fi
          python -m pip install --require-hashes -r "requirements/py${version/./}-${platform}.txt"
          python -m pip install --no-deps --no-build-isolation -e .
      - run: python scripts/check_repository.py
      - run: python -m ruff check .
      # Les copies synthétiques Seestar doivent être sur le volume du logiciel.
      - run: python -c "from pathlib import Path; Path('.pytest_cache').mkdir(exist_ok=True)"
      - run: python -m pytest --basetemp=.pytest_cache/ci-tmp --cov --cov-branch --cov-report=json:local-coverage.json
      - run: python scripts/check_coverage.py local-coverage.json
  distribution:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - run: python -m pip install --require-hashes -r requirements/py313-linux.txt
      - run: python -m pip install --no-deps --no-build-isolation -e .
      - run: python -m mypy
      - run: python scripts/check_secrets.py
      - name: Auditer toutes les versions verrouillées
        run: |
          for lock in requirements/py*.txt; do
            python -m pip_audit -r "$lock" --require-hashes --disable-pip
          done
      - run: python -m build --no-isolation
      - run: python scripts/check_distribution.py
      - run: python -m venv .wheel-check
      - run: .wheel-check/bin/python -m pip install --require-hashes -r requirements/py313-linux.txt
      - run: .wheel-check/bin/python -m pip install --no-deps dist/*.whl
      - name: Vérifier les catalogues installés hors des sources
        working-directory: /tmp
        run: |
          "$GITHUB_WORKSPACE/.wheel-check/bin/python" -c "from gnu_astrolist.catalog import load_caldwell_catalog, load_messier_catalog, load_ngc_catalog; assert len(load_caldwell_catalog()) == 109; assert len(load_messier_catalog()) == 110; assert len(load_ngc_catalog()) == 8098"
          "$GITHUB_WORKSPACE/.wheel-check/bin/python" -m gnu_astrolist --date 2026-08-15 --time-range 21:00-22:00 --lat 45 --lon 0 --az-min 0 --az-max 360 --min-altitude 20 --objects caldwell --max-magnitude -20 --offline
          "$GITHUB_WORKSPACE/.wheel-check/bin/python" -m gnu_astrolist --date 2026-08-15 --time-range 21:00-22:00 --lat 45 --lon 0 --az-min 0 --az-max 360 --min-altitude 20 --objects ngc --max-magnitude 5 --offline --limit 3
          "$GITHUB_WORKSPACE/.wheel-check/bin/python" -m gnu_astrolist --date 2026-08-15 --time-range 21:00-22:00 --lat 45 --lon 0 --az-min 0 --az-max 360 --min-altitude 20 --objects messier caldwell ngc --max-magnitude 5 --offline --limit 3
          "$GITHUB_WORKSPACE/.wheel-check/bin/python" -m gnu_astrolist --date 2026-11-17 --time-range 21:00-22:00 --lat 45 --lon 0 --az-min 0 --az-max 360 --min-altitude 20 --objects bayer flamsteed --offline --limit 3 --output-pdf /tmp/stellar-report.pdf
          "$GITHUB_WORKSPACE/.wheel-check/bin/python" -c "from gnu_astrolist.asteroids import load_asteroid_catalog; assert len(load_asteroid_catalog()) == 1000"
          "$GITHUB_WORKSPACE/.wheel-check/bin/python" -m gnu_astrolist --date 2026-11-17 --time-range 21:00-22:00 --lat 45 --lon 0 --az-min 0 --az-max 360 --min-altitude 10 --objects asteroids messier --max-magnitude 10 --offline --limit 3 --output-pdf /tmp/asteroid-report.pdf
          "$GITHUB_WORKSPACE/.wheel-check/bin/python" -c "from gnu_astrolist.comets import load_comet_catalog; from gnu_astrolist.updates import CATALOG_REGISTRY; assert len(load_comet_catalog()) == 958; assert len(CATALOG_REGISTRY) == 10"
          "$GITHUB_WORKSPACE/.wheel-check/bin/python" -m gnu_astrolist --date 2026-11-17 --time-range 21:00-22:00 --lat 45 --lon 0 --az-min 0 --az-max 360 --min-altitude 10 --objects comets --max-magnitude 18 --offline --update-catalogs force --limit 3 --output-pdf /tmp/comet-report.pdf
          "$GITHUB_WORKSPACE/.wheel-check/bin/python" -c "from gnu_astrolist.satellites import load_satellite_elements; from gnu_astrolist.satcat import load_satcat; assert len(load_satellite_elements()) == 737; assert len(load_satcat()) == 1873"
          "$GITHUB_WORKSPACE/.wheel-check/bin/python" -m gnu_astrolist --date 2026-11-17 --time-range 21:00-21:20 --lat 45 --lon 0 --az-min 0 --az-max 360 --min-altitude 10 --objects satellites debris --offline --update-catalogs force --limit 3 --output-pdf /tmp/satellite-report.pdf

