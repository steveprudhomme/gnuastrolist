name: Qualité
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v5 (révision vérifiée)
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]"
      - run: python scripts/check_repository.py
      - run: python -m ruff check .
      - run: python -m pytest
  distribution:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v5 (révision vérifiée)
        with:
          python-version: '3.13'
      - run: python -m pip install -e ".[dev]"
      - run: python -m build
      - run: python scripts/check_distribution.py
      - run: python -m venv .wheel-check
      - run: .wheel-check/bin/python -m pip install dist/*.whl
      - name: Vérifier les catalogues installés hors des sources
        working-directory: /tmp
        run: |
          "$GITHUB_WORKSPACE/.wheel-check/bin/python" -c "from gnu_astrolist.catalog import load_caldwell_catalog, load_messier_catalog; assert len(load_caldwell_catalog()) == 109; assert len(load_messier_catalog()) == 110"
          "$GITHUB_WORKSPACE/.wheel-check/bin/python" -m gnu_astrolist --date 2026-08-15 --time-range 21:00-22:00 --lat 45 --lon 0 --az-min 0 --az-max 360 --min-altitude 20 --objects caldwell --max-magnitude -20 --offline

