<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="450" viewBox="0 0 1000 450" role="img" aria-labelledby="title desc">
 <title id="title">Comètes : un trajet calculé et une observation datée</title>
 <desc id="desc">Dessin pédagogique synthétique. Le MPC décrit le trajet. Une observation CBAT décrit une mesure passée, séparée de la luminosité estimée pour la soirée. Aucun nombre n'est une mesure réelle.</desc>
 <rect width="1000" height="450" rx="20" fill="#10283f"/>
 <g font-family="DejaVu Sans, sans-serif" fill="white">
  <text x="35" y="48" font-size="25" font-weight="bold">Une comète bouge et sa lumière peut changer</text>
  <text x="35" y="80" font-size="17">Schéma pour apprendre. Ce n'est ni une photo ni une carte du ciel.</text>
  <rect x="35" y="110" width="445" height="200" rx="16" fill="#225e70"/>
  <rect x="520" y="110" width="445" height="200" rx="16" fill="#53527c"/>
  <text x="58" y="145" font-size="23" font-weight="bold">MPC : le trajet</text>
  <path d="M65 250 Q180 170 370 222" fill="none" stroke="#ffca68" stroke-width="4" stroke-dasharray="9 6"/>
  <path d="M330 200 L375 222 L326 222" fill="#a8efe3"/>
  <circle cx="375" cy="222" r="10" fill="white"/>
  <text x="58" y="286" font-size="17">Où sera-t-elle à l'heure choisie ?</text>
  <text x="542" y="145" font-size="23" font-weight="bold">CBAT / ICQ : une mesure</text>
  <text x="542" y="191" font-size="19">Garder la date, la bande</text>
  <text x="542" y="225" font-size="19">et le nom de l'observateur.</text>
  <text x="542" y="280" font-size="17">Une mesure passée reste une mesure passée.</text>
  <rect x="35" y="332" width="930" height="86" rx="14" fill="#f1f6fa"/>
  <g fill="#10283f" font-size="18">
   <text x="57" y="365">Choisis « comets ». Lis « ≈ » : la lumière totale est estimée.</text>
   <text x="57" y="398">La mesure CBAT reste à côté. On ne la transforme pas en prévision.</text>
  </g>
 </g>
</svg>
