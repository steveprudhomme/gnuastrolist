<text x="28" y="42" font-size="25" font-weight="bold">ECC-F : ranger les copies sans toucher aux photos</text>
<rect x="28" y="75" width="280" height="110" rx="12" fill="#e2ede6"/>
<rect x="338" y="75" width="280" height="110" rx="12" fill="#e2ede6"/>
