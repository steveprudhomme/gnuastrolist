<text x="44" y="110" font-size="20">1. Attendre son tour</text>
<text x="44" y="151" font-size="16">Un verrou pour les mises à jour</text>
<text x="354" y="110" font-size="20">2. Simuler le rangement</text>
<text x="354" y="151" font-size="16">Lire ce qui serait retiré</text>
<text x="664" y="110" font-size="20">3. Garder une bonne copie</text>
