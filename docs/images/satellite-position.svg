<svg xmlns="http://www.w3.org/2000/svg" width="960" height="390" viewBox="0 0 960 390" role="img" aria-labelledby="title desc">
<title id="title">Lire les coordonnées du satellite à l'instant retenu</title>
<desc id="desc">Schéma explicatif synthétique, sans passage réel : à 18:33:10, azimut 231,46 degrés vers le sud-ouest et hauteur 62,72 degrés au-dessus de l'horizon.</desc>
<rect width="960" height="390" rx="16" fill="#f2f6f8"/>
<g font-family="sans-serif" fill="#18344a">
<text x="28" y="42" font-size="25" font-weight="bold">Où regarder à l'heure indiquée ?</text>
<text x="28" y="72" font-size="17">Exemple synthétique — schéma explicatif, pas une prévision réelle</text>
<rect x="28" y="96" width="280" height="150" rx="12" fill="#dce8f0"/>
<rect x="338" y="96" width="280" height="150" rx="12" fill="#d7eade"/>
<rect x="648" y="96" width="284" height="150" rx="12" fill="#f4e4bf"/>
<text x="48" y="131" font-size="20" font-weight="bold">1. L'heure locale</text>
<text x="48" y="177" font-size="32">18:33:10</text>
<text x="48" y="216" font-size="17">Le même instant pour les axes</text>
<text x="358" y="131" font-size="20" font-weight="bold">2. L'azimut</text>
<text x="358" y="177" font-size="32">231,46°</text>
<text x="358" y="216" font-size="17">Vers le sud-ouest</text>
<text x="668" y="131" font-size="20" font-weight="bold">3. La hauteur</text>
<text x="668" y="177" font-size="32">62,72°</text>
<text x="668" y="216" font-size="17">Au-dessus de l'horizon</text>
<text x="28" y="283" font-size="18">Azimut : 0° nord · 90° est · 180° sud · 270° ouest</text>
<text x="28" y="316" font-size="18">Hauteur : 0° horizon · 90° juste au-dessus de vous</text>
<text x="28" y="354" font-size="17">Le satellite bouge. Ce point aide au cadrage; il ne commande aucun suivi.</text>
</g></svg>
