<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="430" viewBox="0 0 1000 430" role="img" aria-labelledby="title desc">
<title id="title">ECC-G : du choix de l’observation au rapport</title>
<desc id="desc">Schéma synthétique. La CLI vérifie les paramètres et orchestre les actualisations. Le service appelle les modules métier puis produit un objet de rapport partagé. Les rendus texte et PDF utilisent les formats communs. Le contexte IERS est restauré à la sortie.</desc>
