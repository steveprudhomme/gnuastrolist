<svg xmlns="http://www.w3.org/2000/svg" width="960" height="340" viewBox="0 0 960 340" role="img" aria-labelledby="title desc">
  <title id="title">ECC-H : comparaison des conversions satellitaires</title>
  <desc id="desc">Schéma explicatif synthétique. TLE publics et rotation terrestre gelée alimentent deux chaînes distinctes, Skyfield et Astropy. Leurs résultats Alt/Az sont comparés sans observations réelles.</desc>
  <rect width="960" height="340" fill="#f4f7fa"/>
  <g font-family="sans-serif" fill="#16324f" text-anchor="middle">
    <text x="480" y="32" font-size="22">Références calculées — aucune observation</text>
    <rect x="25" y="105" width="220" height="120" rx="12" fill="#dceaf7" stroke="#16324f"/>
    <text x="135" y="140" font-size="18">TLE publics SGP4</text>
    <text x="135" y="169" font-size="16">UTC + IERS C04 gelés</text>
    <text x="135" y="197" font-size="16">Trois sites d'exemple</text>
    <rect x="320" y="65" width="350" height="80" rx="12" fill="#d9efe5" stroke="#16324f"/>
    <text x="495" y="96" font-size="18">Skyfield → site WGS84 → Alt/Az</text>
    <text x="495" y="123" font-size="15">Génération indépendante, sans Astropy</text>
    <rect x="320" y="190" width="350" height="80" rx="12" fill="#e4e4fa" stroke="#16324f"/>
    <text x="495" y="221" font-size="18">Astropy : TEME → ITRS → AltAz</text>
    <text x="495" y="248" font-size="15">Moteur de production exercé par les tests</text>
    <rect x="735" y="110" width="205" height="110" rx="12" fill="#fff0cc" stroke="#16324f"/>
    <text x="837" y="145" font-size="18">38 comparaisons</text>
    <text x="837" y="174" font-size="16">Direction + distance</text>
    <text x="837" y="201" font-size="16">Dont deux à l'horizon</text>
    <text x="480" y="315" font-size="16">Schéma synthétique • SGP4 commun, transformations distinctes • Sans réfraction</text>
  </g>
  <g fill="none" stroke="#16324f" stroke-width="2">
    <path d="M245 150 L280 150 L280 105 L315 105 M245 180 L280 180 L280 230 L315 230"/>
    <path d="M670 105 L700 105 L700 145 L730 145 M670 230 L700 230 L700 190 L730 190"/>
  </g>
</svg>
