[build-system]
requires = ["setuptools>=77,<90"]
build-backend = "setuptools.build_meta"

[project]
name = "gnu-astrolist"
version = "0.11.0"
description = "Planificateur CLI de soirées d'observation astronomique"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
authors = [{ name = "Contributeurs de GNU Astrolist" }]
keywords = ["astronomie", "astropy", "cli", "étoiles variables", "Messier"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Science/Research",
  "Natural Language :: French",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Scientific/Engineering :: Astronomy",
]
dependencies = [
  "numpy>=1.24,<3",
  "sgp4>=2.25,<3",
  "astropy>=6.0,<9",
  "reportlab>=4.0,<5",
  "tzdata>=2024.1; platform_system == 'Windows'",
]

[project.optional-dependencies]
dev = [
  "build>=1.2,<2",
  "pytest>=8.0,<10",
  "pypdf>=5.0,<7",
  "ruff>=0.5,<1",
  "setuptools>=77,<90",
  "wheel>=0.45,<1",
  "pytest-cov>=6,<8",
  "mypy>=1.15,<2",
  "pip-audit>=2.9,<3",
  "uv==0.13.9",
]

[project.scripts]
gnu-astrolist = "gnu_astrolist.cli:main"
gnu-astrolist-cache = "gnu_astrolist.cache_admin:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
gnu_astrolist = ["data/*.txt.gz", "data/*.json.gz", "data/*.csv.gz", "data/*.csv", "data/*.md", "data/fonts/*.ttf", "data/fonts/*.txt"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B006", "B008", "B018", "B019"]

[tool.mypy]
python_version = "3.10"
files = ["src/gnu_astrolist/validation.py", "src/gnu_astrolist/report_data.py"]
strict = true
follow_imports = "silent"

[[tool.mypy.overrides]]
module = ["numpy", "numpy.*", "astropy", "astropy.*"]
follow_imports = "skip"
follow_imports_for_stubs = true

[tool.coverage.run]
branch = true
source = ["gnu_astrolist"]

[tool.coverage.report]
fail_under = 88
show_missing = true
